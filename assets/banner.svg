<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Vibrant Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle background dynamic pulses */
    @keyframes pulseRing {
      0% { r: 80px; opacity: 0.6; stroke-width: 2px; }
      50% { r: 140px; opacity: 0.2; stroke-width: 4px; }
      100% { r: 80px; opacity: 0.6; stroke-width: 2px; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-15px); opacity: 0.8; }
      100% { transform: translateY(0px); opacity: 0.3; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-circle { animation: pulseRing 6s ease-in-out infinite; transform-origin: 1000px 200px; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Dynamic Elements (Pulsing background rings placed on right side) -->
  <circle cx="1000" cy="200" r="110" fill="none" stroke="#38bdf8" stroke-opacity="0.25" class="pulsing-circle"/>
  <circle cx="1000" cy="200" r="160" fill="none" stroke="#8b5cf6" stroke-opacity="0.15" class="pulsing-circle" style="animation-delay: 2s;"/>

  <!-- Floating Tech Particle Nodes -->
  <circle cx="900" cy="100" r="6" fill="#38bdf8" class="particle-1"/>
  <circle cx="1100" cy="130" r="4" fill="#8b5cf6" class="particle-2"/>
  <circle cx="850" cy="300" r="5" fill="#06b6d4" class="particle-3"/>
  <line x1="900" y1="100" x2="1000" y2="200" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="1100" y1="130" x2="1000" y2="200" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Cloud / Shield DR Graphics (Right Side Accent) -->
  <g transform="translate(920, 120)">
    <!-- Outer Shield -->
    <path d="M80 0 L140 30 V90 C140 140 80 170 80 170 C80 170 20 140 20 90 V30 Z" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)"/>
    <!-- Inner Cloud & Sync Icon -->
    <path d="M55 95 C52 95 50 93 50 90 C50 83 56 77 63 77 C65 72 70 68 76 68 C83 68 89 73 90 80 C94 80 98 84 98 89 C98 94 94 95 90 95 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Refresh Arrows inside Shield -->
    <path d="M70 115 A 15 15 0 0 1 90 105 L95 100 M90 105 L90 112 M90 105 L83 105" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M90 125 A 15 15 0 0 1 70 135 L65 140 M70 135 L70 128 M70 135 L77 135" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Foreground Content Block (Left Aligned - Never Obscured) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="6" fill="#10b981"/>
      <text x="32" y="21" class="badge-text">ENTERPRISE DR &amp; DRAAS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Awesome Cloud Disaster Recovery</text>
    <text x="0" y="215" class="title" fill="url(#accentGrad)">&amp; DRaaS Directory 🚨</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="265" class="subtitle">Continuous Replication • Orchestrated Failover • Cyber Recovery</text>
    <text x="0" y="295" class="subtitle">Bare-Metal Restore • Self-Hosted Business Continuity</text>

    <!-- Metric Pills Footer -->
    <g transform="translate(0, 325)">
      <!-- Pill 1 -->
      <rect width="180" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">☁️ <tspan fill="#f8fafc" font-weight="bold">Commercial DRaaS</tspan></text>
      <!-- Pill 2 -->
      <rect x="195" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="207" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">🔓 <tspan fill="#f8fafc" font-weight="bold">Open-Source DR</tspan></text>
      <!-- Pill 3 -->
      <rect x="390" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="402" y="18" font-family="sans-serif" font-size="12" fill="#94a3b8">⚡ <tspan fill="#f8fafc" font-weight="bold">Sub-Minute RPO</tspan></text>
    </g>
  </g>
</svg>
